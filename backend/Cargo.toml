[package]
name = "rabovel-backend"
version = "0.1.0"
edition = "2021"
authors = ["Rabovel Team"]
description = "Blockchain-based stock broker and staking platform backend"

[dependencies]
# Web framework
actix-web = { version = "4.4", features = ["json"] }
actix-cors = "0.7"
actix-governor = "0.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

# Ethereum / Blockchain
ethers = { version = "2.0", features = ["ws", "abigen", "legacy"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal"] }
rust_decimal = { version = "1.33", features = ["serde"] }

# Authentication & Security
jsonwebtoken = "9.2"
argon2 = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"
